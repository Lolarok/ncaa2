name: Daily NCAA Italians & Tankathon Sync

on:
  schedule:
    # Ogni giorno alle 08:00 ora italiana (07:00 UTC)
    - cron: '0 7 * * *'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install cloudscraper beautifulsoup4 lxml

      - name: Run Scraper & Sync Shared Notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scraper.py

      - name: Commit and Push Updated Files
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "NCAA Daily Bot"
          git add players_data.json community_notes.json
          git diff --staged --quiet || (git commit -m "Auto-update stats, big board & community notes" && git push)
