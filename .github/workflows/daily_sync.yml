name: Daily NCAA Italians & Tankathon Sync

on:
  schedule:
    # 07:00 UTC corrisponde alle 08:00 ora solare italiana (CET)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permette di lanciarlo anche a mano con un click

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install cloudscraper beautifulsoup4 lxml

      - name: Run Scraper & Compute Percentiles
        run: python scraper.py

      - name: Commit and Push Updated JSON
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "NCAA Daily Bot"
          git add players_data.json
          git diff --staged --quiet || (git commit -m "Auto-update stats & big board" && git push)
