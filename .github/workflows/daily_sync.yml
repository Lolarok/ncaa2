name: Daily NCAA Italians & Tankathon Sync

on:
  schedule:
    - cron: '0 7 * * *'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: daily-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install cloudscraper beautifulsoup4 lxml

      - name: Run Scraper & Sync Shared Notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scraper.py

      - name: Commit and Push Updated Files
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "NCAA Daily Bot"
          git add players_data.json community_notes.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update stats, big board & community notes"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push origin HEAD:"${GITHUB_REF_NAME:-main}"
          fi
